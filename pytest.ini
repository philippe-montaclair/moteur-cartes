[pytest]
# ---------------------------------------------------------------------------
# Pourquoi ce fichier existe — 28 août 2026
# ---------------------------------------------------------------------------
#
# Sans lui, `pytest` part de la racine et ramasse TOUT le dossier, y compris
# `_avant_refonte_20260818/`, qui contient six copies quasi identiques du
# projet (`_maj`, `_maj2` … `_maj5`, `_residus`, `tests_originaux`).
#
# Deux dégâts, et le second est le vrai :
#
#   1. « import file mismatch » : six fichiers portent le nom `test_api.py`,
#      pytest ne sait pas lequel il importe. 25 erreurs de collecte, et la
#      suite ne démarre même pas.
#
#   2. **`fabrique` a été importé depuis `_avant_refonte_20260818/_maj5/`**,
#      c'est-à-dire depuis une copie du 18 août. C'est ce qui produisait
#      `ImportError: cannot import name 'contrat' from 'fabrique'` : la suite
#      testait du code périmé sans le dire. C'est exactement l'avertissement
#      d'`AVIS.md` sur les fichiers de sauvegarde — « quand sept variantes
#      cohabitent, plus personne ne sait laquelle fait foi » — reproduit à
#      l'échelle des dossiers.
#
# `run_tests.py` n'avait pas le problème : il ne lit que `tests/test_*.py` et
# place la racine du projet en tête de `sys.path`. D'où 278/278 d'un côté et
# 25 erreurs de l'autre, sur le même dépôt et à la même seconde.
#
# Ce fichier ne corrige pas la cause — les six copies sont toujours là. Il
# empêche l'outil de s'y perdre. La cause se règle en archivant ce dossier,
# qui est déjà versionné dans git.

testpaths = tests

norecursedirs =
    _avant_refonte_*
    _livraisons_*
    _a_supprimer_*
    _corbeille_*
    .venv
    .git
    __pycache__
    fabrique/travaux
    fabrique/quarantaine
    contenus
    node_modules

# Un test qui échoue doit se lire, pas se chercher.
python_files = test_*.py
python_functions = test_*
